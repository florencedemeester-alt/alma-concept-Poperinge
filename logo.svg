<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALMA</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --alma-dark:#2b0505;
  --white:#ffffff;
  --alma-turquoise:#d9f4f0;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Poppins', sans-serif;
  background:var(--white);
  color:var(--alma-dark);
}

/* ---------------- HERO ---------------- */

header{
  min-height:100vh;
  background:var(--alma-turquoise);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:40px 20px;
}

header img{
  width:260px;
  max-width:80%;
  margin-bottom:30px;
  display:block;
}

header p{
  font-size:20px;
  letter-spacing:2px;
}

/* ---------------- NAV ---------------- */

nav{
  position:sticky;
  top:0;
  background:var(--white);
  padding:20px;
  text-align:center;
  z-index:10;
}

nav a{
  margin:0 20px;
  text-decoration:none;
  color:var(--alma-dark);
  font-weight:600;
  letter-spacing:2px;
}

/* ---------------- SECTIONS ---------------- */

section{
  padding:100px 10%;
}

h2{
  font-size:42px;
  margin-bottom:30px;
  text-align:center;
}

/* ---------------- ABOUT ---------------- */

.about{
  background:#f9fefe;
  text-align:center;
}

.about p{
  max-width:700px;
  margin:auto;
  font-size:18px;
}

/* ---------------- GALLERY ---------------- */

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:25px;
}

.gallery img{
  width:100%;
  height:320px;
  object-fit:cover;
  border-radius:25px;
  transition:.4s;
  display:block;
}

.gallery img:hover{
  transform:scale(1.05);
}

/* ---------------- 3D ---------------- */

.tour-section{
  padding-top:30px;
  padding-bottom:80px;
}

.tour-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  max-width:1000px;
  margin:auto;
  padding:45px 50px;
  background:var(--alma-dark);
  color:var(--white);
  border:2px solid var(--alma-dark);
  border-radius:25px;
  text-decoration:none;
  transition:background .2s,color .2s;
}

.tour-card h2{
  margin:0 0 8px;
  text-align:left;
}

.tour-card p{font-size:18px;}
.tour-arrow{font-size:42px;}
.tour-card:hover{background:#f9fefe;color:var(--alma-dark);}
.tour-card:focus-visible{outline:3px solid #0099cd;outline-offset:5px;}

@media(max-width:768px){
  nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 20px;}
  nav a{margin:0;}
  .tour-card{padding:30px 25px;}
  .tour-card p{font-size:16px;}
}

/* ---------------- CONTACT ---------------- */

.contact{
  background:var(--alma-turquoise);
  text-align:center;
}

.contact p{
  font-size:18px;
  margin-bottom:15px;
}

.contact a{
  color:var(--alma-dark);
  font-weight:600;
  text-decoration:none;
}

/* ---------------- FOOTER ---------------- */

footer{
  background:var(--alma-dark);
  color:white;
  padding:40px;
  text-align:center;
}

/* ---------------- MOBILE ---------------- */

@media(max-width:768px){
  h2{font-size:32px;}
}

</style>
</head>

<body>

<!-- HERO -->
<header>
  <img src="logo.svg" alt="ALMA logo" onerror="this.style.display='none'">
  <p>EVENT SPACE • PRIVATE PARTIES • CREATIVE GATHERINGS</p>
</header>

<!-- NAV -->
<nav>
  <a href="#about">OVER</a>
  <a href="#gallery">GALERIJ</a>
  <a href="3d web.html">3D</a>
  <a href="#contact">CONTACT</a>
</nav>

<!-- ABOUT -->
<section id="about" class="about">
<h2>OVER ALMA</h2>
<p>
  ALMA is een hippe eventlocatie waar sfeer, design en beleving samenkomen.<br>
  Perfect voor verjaardagen, private diners, bedrijfsfeesten en creatieve events.<br>
  Jij droomt – wij bouwen het decor.
</p>
</section>

<!-- GALLERY -->
<section id="gallery">
<h2>GALERIJ</h2>
<div class="gallery" id="galleryGrid"></div>
</section>

<!-- 3D -->
<section id="tour" class="tour-section" aria-label="ALMA in 3D">
  <a class="tour-card" href="3d web.html">
    <div>
      <h2>3D</h2>
      <p>Ontdek ALMA in 3D</p>
    </div>
    <span class="tour-arrow" aria-hidden="true">↗</span>
  </a>
</section>

<!-- CONTACT -->
<section id="contact" class="contact">
<h2>CONTACT</h2>

<p><a href="tel:+32468234143">0468 23 41 43</a></p>
<p>Abeelseweg 232, 8970 Poperinge</p>
<p>Instagram: @__alma__concept</p>

</section>

<footer>
© 2025 ALMA
</footer>

<!-- AUTO GALLERY SCRIPT -->
<script>
const gallery = document.getElementById("galleryGrid");
const imageNames = [
  "image1.jpg",
  "image2.jpg",
  "image3.jpg",
  "image4.jpg",
  "image5.jpg",
  "image6.jpg",
  "image7.jpg",
  "image8.jpg"
];

imageNames.forEach((src, index) => {
  const img = document.createElement("img");
  img.src = src;
  img.alt = `ALMA image ${index + 1}`;
  img.loading = "lazy";
  img.decoding = "async";
  img.onerror = () => {
    img.style.display = "none";
  };
  gallery.appendChild(img);
});
</script>

</body>
</html>
